<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6f2" />
    <title>Copilot Ledger | Usage overview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/dashboard.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="/dashboard" aria-label="Copilot Ledger home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="brand-name">copilot<span>ledger</span></span>
        </a>

        <div class="workspace-label">WORKSPACE</div>
        <nav class="navigation" aria-label="Main navigation">
          <button class="nav-item is-active" data-view="overview"><span class="nav-icon" aria-hidden="true">◫</span>Overview</button>
          <button class="nav-item" data-view="initiatives"><span class="nav-icon" aria-hidden="true">▤</span>Initiatives</button>
          <button class="nav-item" data-view="features"><span class="nav-icon" aria-hidden="true">⌘</span>Features</button>
          <button class="nav-item" data-view="usage"><span class="nav-icon" aria-hidden="true">↗</span>Usage</button>
          <button class="nav-item" data-view="people"><span class="nav-icon" aria-hidden="true">◎</span>People</button>
        </nav>

        <div class="sidebar-bottom">
          <div class="connection"><span class="connection-dot"></span><span id="connection-label">Connecting to API</span></div>
          <a class="docs-link" href="/docs" target="_blank" rel="noreferrer">API documentation <span aria-hidden="true">↗</span></a>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb"><span>WORKSPACE</span><span class="breadcrumb-slash">/</span><span id="breadcrumb-current">OVERVIEW</span></div>
          <div class="topbar-right">
            <span class="today-label" id="today-label"></span>
            <button class="icon-button" id="refresh-button" title="Refresh dashboard" aria-label="Refresh dashboard"><span aria-hidden="true">⟳</span></button>
            <button class="avatar" title="Workspace settings" aria-label="Workspace settings">CL</button>
          </div>
        </header>

        <section class="page-content">
          <div class="page-heading">
            <div>
              <p class="eyebrow" id="page-eyebrow">USAGE INTELLIGENCE</p>
              <h1 id="page-title">Overview</h1>
              <p class="page-description" id="page-description">A clear view of AI credit consumption across your workspace.</p>
            </div>
            <div id="heading-action"></div>
          </div>
          <div id="notice" class="notice" role="status" hidden></div>
          <div id="view-root" aria-live="polite"><div class="loading-state"><span class="spinner"></span>Loading workspace data</div></div>
        </section>
        <footer class="page-footer"><span>Copilot AI Credit Tracker</span><span>Usage data is provided by your connected workspace</span></footer>
      </main>
    </div>

    <dialog id="form-dialog" class="form-dialog">
      <form id="dialog-form" method="dialog">
        <div class="dialog-heading"><div><p class="eyebrow" id="dialog-eyebrow">WORKSPACE</p><h2 id="dialog-title">Create</h2></div><button class="icon-button" type="button" data-close-dialog aria-label="Close dialog">×</button></div>
        <div id="dialog-fields" class="dialog-fields"></div>
        <div class="dialog-actions"><button class="button button-quiet" type="button" data-close-dialog>Cancel</button><button class="button button-primary" type="submit" id="dialog-submit">Create</button></div>
      </form>
    </dialog>
  </body>
</html>
